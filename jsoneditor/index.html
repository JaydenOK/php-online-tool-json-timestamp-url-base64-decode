<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 编辑器</title>
<link href="./dist/jsoneditor.min.css" rel="stylesheet" type="text/css">
<style>
html, body {
	margin: 0;
	height: 100%;
	background: #eee;
	font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}
.toolbar {
	height: 42px;
	box-sizing: border-box;
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 0 12px;
	background: #f7f7f7;
	border-bottom: 1px solid #ddd;
}
.title {
	font-size: 16px;
	font-weight: bold;
	margin-right: 8px;
}
#msg {
	color: #c0392b;
	margin-left: 8px;
}
.hint {
	margin-left: auto;
	color: #888;
	font-size: 13px;
}
#jsoneditor {
	height: calc(100% - 42px);
}
button {
	background-color: #777;
	border: 1px solid transparent;
	color: #fff;
	border-radius: 2px;
	padding: 4px 10px;
	cursor: pointer;
}
button:hover {
	background: #64492b;
}
</style>
</head>
<body>
<div class="toolbar">
	<span class="title">JSON 编辑器</span>
	<button type="button" id="btn-format">格式化</button>
	<button type="button" id="btn-compact">压缩</button>
	<button type="button" id="btn-copy">复制</button>
	<button type="button" id="btn-clear">清空</button>
	<span id="msg"></span>
	<span class="hint">可直接粘贴 JSON，右上角可切换树、代码、文本等模式</span>
</div>
<div id="jsoneditor"></div>
<script src="./dist/jsoneditor.min.js"></script>
<script>
var editor = new JSONEditor(document.getElementById('jsoneditor'), {
	language: 'zh-CN',
	languages: {
		'zh-CN': {
			searchTitle: '搜索字段和值',
			searchNextResultTitle: '下一个结果 (Enter)',
			searchPreviousResultTitle: '上一个结果 (Shift + Enter)',
			modeEditorTitle: '切换编辑模式'
		}
	},
	mode: 'code',
	modes: ['tree', 'code', 'form', 'text', 'view', 'preview'],
	mainMenuBar: true,
	navigationBar: true,
	statusBar: true,
	search: true,
	history: true
});

editor.setText('');

function showMsg(text) {
	var el = document.getElementById('msg');
	el.textContent = text;
	window.setTimeout(function () {
		if (el.textContent === text) {
			el.textContent = '';
		}
	}, 1600);
}

function fallbackCopy(text) {
	var input = document.createElement('textarea');
	input.value = text;
	document.body.appendChild(input);
	input.select();
	document.execCommand('copy');
	input.remove();
	showMsg('已复制');
}

document.getElementById('btn-format').onclick = function () {
	try {
		var data = editor.get();
		var mode = editor.getMode();
		if (mode === 'code' || mode === 'text') {
			editor.set(data);
			editor.format();
		} else {
			editor.update(data);
		}
		showMsg('已格式化');
	} catch (err) {
		showMsg('JSON 格式不正确，无法格式化');
	}
};

document.getElementById('btn-compact').onclick = function () {
	try {
		var data = editor.get();
		var mode = editor.getMode();
		if (mode === 'code' || mode === 'text') {
			editor.setText(JSON.stringify(data));
			showMsg('已压缩');
		} else {
			showMsg('请切换到代码或文本模式后再压缩');
		}
	} catch (err) {
		showMsg('JSON 格式不正确，无法压缩');
	}
};

document.getElementById('btn-copy').onclick = function () {
	var text;
	try {
		text = editor.getText();
	} catch (err) {
		showMsg('没有可复制的内容');
		return;
	}
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(text).then(function () {
			showMsg('已复制');
		}).catch(function () {
			fallbackCopy(text);
		});
	} else {
		fallbackCopy(text);
	}
};

document.getElementById('btn-clear').onclick = function () {
	var mode = editor.getMode();
	if (mode === 'code' || mode === 'text') {
		editor.setText('');
	} else {
		editor.set({});
	}
	showMsg('已清空');
};
</script>
</body>
</html>
