<script>
	//复制文本
	function copyInnerText(text)
	{
		var tmpInput = document.createElement("input");
		tmpInput.setAttribute("type","text");
		tmpInput.setAttribute("value", text);
		document.body.appendChild(tmpInput);
		tmpInput.select();
		document.execCommand("cut");
		tmpInput.remove();
		return true;
	}

	function setTheme(theme)
	{
		if (theme) {
			document.body.setAttribute("data-theme", theme);
		} else {
			document.body.removeAttribute("data-theme");
		}
		try { localStorage.setItem("tool-theme", theme || ""); } catch (e) {}
	}
	
	$(function(){
		try {
			var savedTheme = localStorage.getItem("tool-theme");
			if (savedTheme) setTheme(savedTheme);
		} catch (e) {}

		$("#copyRunResult").on('click',function(){
			copyInnerText($("#run_result").html());
			$("#msg").html("复制成功");
			window.setTimeout(function(){
				$("#msg").html("");
			}, 1000);
		});
	
	})

</script>

<script>
var url="http://tool.cc/do.php";
$(function(){
	function padTime(n) {
		return n < 10 ? "0" + n : "" + n;
	}

	function formatLocalDate(date) {
		return date.getFullYear() + "-"
			+ padTime(date.getMonth() + 1) + "-"
			+ padTime(date.getDate()) + " "
			+ padTime(date.getHours()) + ":"
			+ padTime(date.getMinutes()) + ":"
			+ padTime(date.getSeconds());
	}

	function daysInMonth(year, month) {
		return new Date(year, month, 0).getDate();
	}

	function showTimeError(message) {
		$("#time_msg").text(message).addClass("is-visible");
	}

	function clearTimeError() {
		$("#time_msg").text("").removeClass("is-visible");
	}

	function fillNow() {
		var date = new Date();
		$("#left_input").val(formatLocalDate(date));
		$("#right_input").val(Math.floor(date.getTime() / 1000));
		clearTimeError();
	}

	function dateToTimestamp() {
		var text = $("#left_input").val().trim();
		if (text === "") {
			showTimeError("请输入日期，格式如 2026-10-15 或 2026-10-15 10:56:10");
			return;
		}
		var matched = text.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/);
		if (!matched) {
			showTimeError("日期格式不正确，请使用 YYYY-MM-DD 或 YYYY-MM-DD HH:mm:ss");
			return;
		}
		var year = +matched[1];
		var month = +matched[2];
		var day = +matched[3];
		var hour = matched[4] === undefined ? 0 : +matched[4];
		var minute = matched[5] === undefined ? 0 : +matched[5];
		var second = matched[6] === undefined ? 0 : +matched[6];
		if (month < 1 || month > 12 || hour > 23 || minute > 59 || second > 59 || day < 1 || day > daysInMonth(year, month)) {
			showTimeError("日期不存在，请检查年月日和时间是否有效");
			return;
		}
		var date = new Date(year, month - 1, day, hour, minute, second);
		if (isNaN(date.getTime())) {
			showTimeError("日期无法转换，请检查输入");
			return;
		}
		$("#right_input").val(Math.floor(date.getTime() / 1000));
		clearTimeError();
	}

	function timestampToDate() {
		var text = $("#right_input").val().trim();
		if (text === "") {
			showTimeError("请输入时间戳，支持秒或毫秒整数");
			return;
		}
		if (!/^-?\d+$/.test(text)) {
			showTimeError("时间戳格式不正确，请输入整数秒或毫秒，不要包含空格、小数或单位");
			return;
		}
		var value = Number(text);
		if (!isFinite(value)) {
			showTimeError("时间戳超出可转换范围");
			return;
		}
		var ms = Math.abs(value) >= 1e12 ? value : value * 1000;
		var date = new Date(ms);
		if (isNaN(date.getTime())) {
			showTimeError("时间戳超出可转换范围");
			return;
		}
		$("#left_input").val(formatLocalDate(date));
		clearTimeError();
	}

    $('#now').click(fillNow);
	$('#to_left').click(timestampToDate);
	$('#to_right').click(dateToTimestamp);
	
	
	$('#run').click(function(){
		php_code = $("#php_code").val().trim() ;
		if(php_code != ""){
			$.ajax({
				 type: "POST",
				 url: url,
